# Snare development lab. Everything here is local; nothing is exposed beyond
# 127.0.0.1 on the host.
#
#   ./lab.sh up           build, start, wait for health, bootstrap ARTEX
#   ./lab.sh status       print health of every service
#   ./lab.sh test-egress  prove ARTEX can reach only the allowed LLM hosts
#   ./lab.sh down         stop (add -v to drop volumes)
#
# The network is the boundary that keeps ARTEX on lab targets. Containment
# rule: ARTEX and every container ARTEX can reach are on internal networks
# only, which have no route to the internet. Otherwise ARTEX could pivot
# through a reachable container, for example Juice Shop's deliberate SSRF.
# The only exceptions are egress (allowlisted LLM hosts) and artex-ui (dials
# only artex:8787). lab.sh test-egress audits this.
#
#   lab          internal  artex, juice-shop, snare, playwright (on demand)
#   artex-db     internal  artex, postgres
#   llm-egress   internal  artex, egress   (ARTEX_LLM_PROXY=http://egress:3128)
#   artex-admin  internal  artex, artex-ui
#   snare-admin  internal  snare, snare-ports   (ARTEX is not on it)
#   outbound     bridge    egress only: the single way out, allowlisted hosts only
#   front        bridge    artex-ui, snare-ports: host loopback port publishing
name: snare-lab

services:
  juice-shop:
    # Latest stable at build time (2026-11-18). Change deliberately.
    image: bkimminich/juice-shop:v20.4.0
    networks: [lab]
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e",
        "require('http').get('http://127.0.0.1:3000/rest/admin/application-version',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  postgres:
    # Same image ARTEX's own compose file uses at the pinned commit.
    image: postgres:16-alpine
    networks: [artex-db]
    environment:
      POSTGRES_USER: artex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./lab.sh up, which generates .env}
      POSTGRES_DB: artex
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artex -d artex"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Unmodified ARTEX, built from the pinned checkout next to this repo. Never
  # started (scale 0); it exists so artex below can build its overlay on it.
  artex-base:
    build:
      context: ${ARTEX_SRC:-../../../ARTEX}
      args:
        ARTEX_VERSION: d89cf78
    image: snare-lab/artex:d89cf78
    network_mode: none
    scale: 0

  artex:
    # ARTEX plus the offline overlay (baked nuclei templates, update checks
    # off). See artex-offline/Dockerfile.
    build:
      context: ./artex-offline
      additional_contexts:
        artex-base: service:artex-base
      args:
        ARTEX_IMAGE: artex-base
    image: snare-lab/artex-offline:d89cf78
    depends_on:
      postgres:
        condition: service_healthy
      egress:
        condition: service_healthy
    networks: [lab, artex-db, llm-egress, artex-admin]
    environment:
      ARTEX_PG_DSN: postgres://artex:${POSTGRES_PASSWORD}@postgres:5432/artex?sslmode=disable
      ARTEX_JWT_KEY_DIR: /app/keys
      # LLM settings are left to the operator. lab.sh never writes a key.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      # The only way out. A profile saved in ARTEX's UI without this proxy
      # simply cannot connect: the network has no other route.
      ARTEX_LLM_PROXY: http://egress:3128
      # Brakes. Snare forces these on per task in active mode (M7); the lab
      # sets conservative defaults so a manual run is also braked.
      ARTEX_NOISE_PROFILE: ${ARTEX_NOISE_PROFILE:-quiet}
      ARTEX_TASK_BUDGET_TOKENS: ${ARTEX_TASK_BUDGET_TOKENS:-2000000}
      ARTEX_TASK_BUDGET_TURNS: ${ARTEX_TASK_BUDGET_TURNS:-400}
      ARTEX_INTENT_BUDGET_TOKENS: ${ARTEX_INTENT_BUDGET_TOKENS:-200000}
      ARTEX_INTENT_BUDGET_TURNS: ${ARTEX_INTENT_BUDGET_TURNS:-40}
      ARTEX_UNTRUSTED_BOUNDARY: ""
      ARTEX_UPDATE_CHECK: ""
    # No ports: ARTEX is on internal networks only. Its UI reaches the host
    # through artex-ui. Its recording proxy (8788) is not reachable from
    # outside the container at all.
    volumes:
      - artex-data:/app/data
      - artex-keys:/app/keys
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/api/health"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s
    restart: unless-stopped

  # Allowlisting CONNECT proxy: ARTEX's only route to the internet.
  egress:
    build:
      context: ../..
    image: snare-lab/snare:dev
    entrypoint: ["/usr/local/bin/labnet", "egress", "-listen", ":3128"]
    command: []
    environment:
      LLM_EGRESS_ALLOW: ${LLM_EGRESS_ALLOW:-api.openai.com,api.anthropic.com}
    networks: [llm-egress, outbound]
    healthcheck:
      test: ["CMD", "/usr/local/bin/labnet", "probe", "-url", "http://127.0.0.1:3128/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Fixed-destination forwarder that publishes ARTEX's UI on host loopback.
  # It only ever dials artex:8787, so ARTEX cannot use it to get out.
  artex-ui:
    build:
      context: ../..
    image: snare-lab/snare:dev
    depends_on:
      egress:
        condition: service_started
    entrypoint: ["/usr/local/bin/labnet", "forward", "-map", ":8787=artex:8787"]
    command: []
    networks: [artex-admin, front]
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      test: ["CMD", "/usr/local/bin/labnet", "probe", "-url", "http://127.0.0.1:8787/api/health"]
      interval: 5s
      timeout: 3s
      retries: 60
    restart: unless-stopped

  snare:
    build:
      context: ../..
    image: snare-lab/snare:dev
    # Internal networks only: ARTEX can reach Snare, so Snare must not be a
    # way out. Its ports reach the host through snare-ports.
    networks: [lab, snare-admin]
    secrets:
      - snare_api_token
      - artex_admin_password
      - artex_webhook_secret
    volumes:
      - ./snare.lab.yaml:/etc/snare/snare.yaml:ro
      - snare-data:/var/lib/snare
    depends_on:
      juice-shop:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/snare", "healthcheck", "-url", "http://127.0.0.1:8780/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Scripted legitimate traffic (bench/playwright). Internal lab network
  # only: it can reach Snare's gateway and nothing on the internet. Runs on
  # demand: ./lab.sh traffic
  playwright:
    build:
      context: ../../bench/playwright
    image: snare-lab/playwright:1.65.1
    profiles: ["traffic"]
    networks: [lab]
    environment:
      BASE_URL: ${PLAYWRIGHT_BASE_URL:-http://snare:8000}
    volumes:
      - ./run/playwright:/results
    depends_on:
      snare:
        condition: service_healthy

  # Fixed-destination forwarder that publishes Snare's ports on host
  # loopback. It shares only snare-admin with Snare, so ARTEX cannot reach it.
  snare-ports:
    build:
      context: ../..
    image: snare-lab/snare:dev
    depends_on:
      snare:
        condition: service_started
    entrypoint: ["/usr/local/bin/labnet", "forward",
      "-map", ":8000=snare:8000", "-map", ":8780=snare:8780"]
    command: []
    networks: [snare-admin, front]
    ports:
      - "127.0.0.1:8000:8000"   # gateway (protected Juice Shop)
      - "127.0.0.1:8780:8780"   # Snare API and UI
    healthcheck:
      test: ["CMD", "/usr/local/bin/labnet", "probe", "-url", "http://127.0.0.1:8780/healthz"]
      interval: 5s
      timeout: 3s
      retries: 60
    restart: unless-stopped

networks:
  lab:
    internal: true
  artex-db:
    internal: true
  llm-egress:
    internal: true
  artex-admin:
    internal: true
  snare-admin:
    internal: true
  outbound: {}
  front: {}

secrets:
  snare_api_token:
    file: ./secrets/snare_api_token
  artex_admin_password:
    file: ./secrets/artex_admin_password
  artex_webhook_secret:
    file: ./secrets/artex_webhook_secret

volumes:
  pgdata:
  artex-data:
  artex-keys:
  snare-data:
