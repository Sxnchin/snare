# Snare configuration for the compose lab. Paths are inside the container.
server:
  # The container's own network namespace; the host publishes it on loopback.
  listen: 0.0.0.0:8780
  allow_non_loopback: true
  api_token_file: /run/secrets/snare_api_token

store:
  path: /var/lib/snare/snare.db

secrets:
  key_file: /var/lib/snare/secret.key

gateway:
  listen: 0.0.0.0:8000
  routes:
    - name: juice-shop
      path_prefix: /
      upstream: http://juice-shop:3000
      mode: record

recorder:
  # ARTEX's traffic through the gateway is attack traffic, never benign
  # corpus. ARTEX has a fixed address on the lab network (compose.yaml), so
  # there is no resolution window. This is the backup for the header below:
  # it also covers tools that do not use ARTEX's capture proxy.
  exclude_sources: [10.203.0.10]

scanner:
  # ARTEX's capture proxy adds this header to every request it sends to
  # host "snare" (a rewrite rule that lab.sh bootstrap installs). Snare
  # removes it before proxying and never records such requests.
  header: X-Snare-Scanner
  secret_file: /run/secrets/snare_scanner_secret

artex:
  url: http://artex:8787
  username: ARTEX
  password_file: /run/secrets/artex_admin_password
  webhook_secret_file: /run/secrets/artex_webhook_secret
  timeout: 30s

active:
  enabled: false
