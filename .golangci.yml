version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - revive
    - unconvert
  settings:
    errcheck:
      # Best-effort cleanup on paths that already return an error, and
      # writes to the CLI's stdout/stderr.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (net.Conn).Close
        - (net.Listener).Close
        - (*database/sql.DB).Close
        - (*database/sql.Tx).Rollback
        - (*github.com/snare-dev/snare/internal/store.Store).Close
        - os.Remove
        - os.RemoveAll
        - (*database/sql.Rows).Close
        - (*text/tabwriter.Writer).Flush
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gosec:
      excludes:
        - G304 # file paths come from operator configuration
        - G104 # unhandled errors are errcheck's job, configured above
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, errcheck]
formatters:
  enable:
    - gofmt
