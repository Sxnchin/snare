name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Pinned: golangci-lint v2.6.2 cannot read Go 1.27 export data
          # (docs/ASSUMPTIONS.md).
          go-version: "1.26.10"
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.6.2

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: dependency licenses must be Apache-2.0 compatible
        run: |
          go run github.com/google/go-licenses/v2@v2.0.1 check ./... \
            --allowed_licenses=Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC,MPL-2.0

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compose file is valid
        working-directory: deploy/compose
        env:
          ARTEX_SRC: /nonexistent
        run: |
          mkdir -p secrets
          for f in snare_api_token artex_admin_password artex_webhook_secret; do echo x > secrets/$f; done
          POSTGRES_PASSWORD=x docker compose -f compose.yaml config -q
      - name: snare image builds
        run: docker build -t snare:ci .
